version: 2

# Dependabot opens one grouped pull request per ecosystem per week.
# Major updates are ignored on purpose: they need a human to read the
# migration notes. Raise them by hand when you want them.
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      client:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Tailwind 4 and Stripe 22 are rewrites, not upgrades.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      agents:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The mcp upper bound is load-bearing. mcp 2.x moved
      # mcp.shared.session, which google-adk imports, so the agent package
      # fails to load. Do not let Dependabot lift this pin.
      - dependency-name: "mcp"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
