name: Bug report
description: Something in Hodari does not work as expected.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not put API keys, connection strings,
        or other secrets in this issue.

        For a security problem, do not open an issue. Read SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /chat
        2. Ask for "vegan food near the stadium"
        3. Wait for the itinerary
        4. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part is affected
      options:
        - Frontend (client)
        - Agent runtime (agents)
        - Map rendering
        - Voice
        - MongoDB / MCP
        - Deployment / infra
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Local dev, Chrome 140, macOS 15, Python 3.12, Node 20"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the relevant logs. Remove every secret first.
      render: shell
