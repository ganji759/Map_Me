name: Feature request
description: Suggest a new capability for Hodari.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can a user not do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: The change you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: dropdown
    id: area
    attributes:
      label: Which part does this touch
      options:
        - Frontend (client)
        - Agent runtime (agents)
        - Map rendering
        - Voice
        - Data model
        - Deployment / infra
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues for a duplicate.
          required: true
        - label: This does not add a fifth agent. Hodari keeps four agents on purpose.
          required: true
